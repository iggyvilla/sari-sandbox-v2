[project]
name = "sari-agent"
version = "0.1.0"
description = "Python harness for driving Sari Sandbox through OpenAI Responses and Unity commands."
requires-python = ">=3.11"
dependencies = [
  "openai",
  "websockets",
  "rich",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-asyncio",
]

[project.scripts]
sari-agent = "sari_agent.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
